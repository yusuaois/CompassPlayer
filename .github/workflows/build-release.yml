name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 🏷️ Read Version from config.py
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path config.py -Pattern '"version"\s*:\s*"([^"]+)"'
          $v = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0.0" }
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "读取到版本: $v"

      - name: 🏗️ Build Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name CompassPlayer --icon assets/icon.ico main.py

      - name: 📁 Assemble Release Folder
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dir = "release/CompassPlayer_v$v"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item "dist/CompassPlayer.exe" $dir
          Copy-Item "assets" "$dir/assets" -Recurse
          Copy-Item "README.md" $dir

      - name: 🗜️ Create RAR Archive
        shell: pwsh
        run: |
          choco install winrar -y --no-progress --limit-output
          $rar = "C:\Program Files\WinRAR\Rar.exe"
          if (-not (Test-Path $rar)) {
            $cmd = Get-Command rar.exe -ErrorAction SilentlyContinue
            if ($cmd) { $rar = $cmd.Source } else { throw "Rar.exe 未找到" }
          }
          & $rar a -r -ep1 "CompassPlayer_v${{ steps.version.outputs.version }}.rar" "release\CompassPlayer_v${{ steps.version.outputs.version }}"
          Get-ChildItem *.rar | ForEach-Object { echo "生成: $($_.FullName) ($($_.Length) bytes)" }

      - name: 📤 Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: CompassPlayer_*.rar
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
